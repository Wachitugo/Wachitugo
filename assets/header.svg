<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Benjamín Ruiz — Software Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1d3a"><animate attributeName="stop-color" values="#0b1d3a;#1F4E79;#3a1c71;#0b1d3a" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#3a1c71"><animate attributeName="stop-color" values="#3a1c71;#0b6e8a;#1F4E79;#3a1c71" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#7fdbff"/>
  </linearGradient>
</defs>
<style>
  .edge { stroke:#7fdbff; stroke-width:2; stroke-opacity:.55; stroke-dasharray:6 8; animation: flow 3s linear infinite; }
  .node { fill:#7fdbff; }
  .pulse { fill:none; stroke:#7fdbff; stroke-width:2; transform-box: fill-box; transform-origin:center; animation: pulse 2.8s ease-out infinite; }
  .name { font-weight:800; font-size:46px; font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill:#ffffff; }
  .sub  { font-weight:500; font-size:20px; font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill:#d6e9ff; letter-spacing:1px; }
  .chip { font-weight:600; font-size:13px; font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; fill:#0b1d3a; letter-spacing:1.5px; }
  .in { animation: rise 1.2s ease-out both; }
  @keyframes flow { to { stroke-dashoffset:-56; } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.9; } 100% { transform:scale(3.2); opacity:0; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
</style>
<rect width="1000" height="260" rx="18" fill="url(#bg)"/>
<line x1="70" y1="60" x2="170" y2="150" class="edge" style="animation-delay:0.00s"/><line x1="170" y1="150" x2="90" y2="215" class="edge" style="animation-delay:0.35s"/><line x1="70" y1="60" x2="250" y2="70" class="edge" style="animation-delay:0.70s"/><line x1="170" y1="150" x2="250" y2="70" class="edge" style="animation-delay:1.05s"/><line x1="860" y1="55" x2="940" y2="160" class="edge" style="animation-delay:1.40s"/><line x1="940" y1="160" x2="800" y2="200" class="edge" style="animation-delay:1.75s"/><line x1="860" y1="55" x2="720" y2="95" class="edge" style="animation-delay:2.10s"/><line x1="800" y1="200" x2="720" y2="95" class="edge" style="animation-delay:2.45s"/><line x1="940" y1="160" x2="720" y2="95" class="edge" style="animation-delay:2.80s"/><circle cx="70" cy="60" r="7" class="node"/><circle cx="70" cy="60" r="7" class="pulse" style="animation-delay:0.0s"/><circle cx="170" cy="150" r="7" class="node"/><circle cx="170" cy="150" r="7" class="pulse" style="animation-delay:0.4s"/><circle cx="90" cy="215" r="7" class="node"/><circle cx="90" cy="215" r="7" class="pulse" style="animation-delay:0.8s"/><circle cx="250" cy="70" r="7" class="node"/><circle cx="250" cy="70" r="7" class="pulse" style="animation-delay:1.2s"/><circle cx="860" cy="55" r="7" class="node"/><circle cx="860" cy="55" r="7" class="pulse" style="animation-delay:1.6s"/><circle cx="940" cy="160" r="7" class="node"/><circle cx="940" cy="160" r="7" class="pulse" style="animation-delay:2.0s"/><circle cx="800" cy="200" r="7" class="node"/><circle cx="800" cy="200" r="7" class="pulse" style="animation-delay:2.4s"/><circle cx="720" cy="95" r="7" class="node"/><circle cx="720" cy="95" r="7" class="pulse" style="animation-delay:2.8s"/>
<g class="in">
  <text x="500" y="112" text-anchor="middle" class="name">Benjamín <tspan fill="#7fdbff">Ruiz</tspan></text>
  <text x="500" y="150" text-anchor="middle" class="sub">Software Engineer  ·  Backend  ·  Cloud  ·  Applied AI</text>
</g>
<g class="in" style="animation-delay:.4s">
  <rect x="337" y="176" width="150" height="30" rx="15" fill="#7fdbff"/>
  <text x="412" y="196" text-anchor="middle" class="chip">MULTI-AGENT</text>
  <rect x="497" y="176" width="166" height="30" rx="15" fill="#ffd36e"/>
  <text x="580" y="196" text-anchor="middle" class="chip">PUERTO MONTT, CL</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Terminal with funny dev commands">
<style>
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace;font-size:13px;opacity:0;white-space:pre}
.pr{fill:#7fdbff;font-weight:700} .cmd{fill:#ffffff;font-weight:600} .out{fill:#b8c4d6}
.ok{fill:#5ee38b} .warn{fill:#ffd36e}
.ttl{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;fill:#8b98ab}
.cur{fill:#7fdbff;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes k0{0%,2.857%{opacity:0}2.858%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f0{animation:k0 14.0s linear infinite}
@keyframes k1{0%,10.357%{opacity:0}10.358%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f1{animation:k1 14.0s linear infinite}
@keyframes k2{0%,17.857%{opacity:0}17.858%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f2{animation:k2 14.0s linear infinite}
@keyframes k3{0%,25.357%{opacity:0}25.358%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f3{animation:k3 14.0s linear infinite}
@keyframes k4{0%,32.857%{opacity:0}32.858%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f4{animation:k4 14.0s linear infinite}
@keyframes k5{0%,40.357%{opacity:0}40.358%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f5{animation:k5 14.0s linear infinite}
@keyframes k6{0%,47.857%{opacity:0}47.858%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f6{animation:k6 14.0s linear infinite}
@keyframes k7{0%,55.357%{opacity:0}55.358%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f7{animation:k7 14.0s linear infinite}
@keyframes k8{0%,62.857%{opacity:0}62.858%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f8{animation:k8 14.0s linear infinite}
@keyframes k9{0%,70.357%{opacity:0}70.358%,94.286%{opacity:1}94.287%,100%{opacity:0}} .f9{animation:k9 14.0s linear infinite}
</style>
<rect width="560" height="320" rx="14" fill="#0d1b2e"/>
<rect width="560" height="34" rx="14" fill="#16263d"/><rect y="20" width="560" height="14" fill="#16263d"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="280" y="21" text-anchor="middle" class="ttl">benjamin@puerto-montt: ~</text>
<text x="22" y="72" class="m f0"><tspan class="pr">$ </tspan><tspan class="cmd">whoami</tspan></text><text x="22" y="95" class="m f1"><tspan class="pr"></tspan><tspan class="out">benjamin  // backend · cloud · applied ai</tspan></text><text x="22" y="118" class="m f2"><tspan class="pr">$ </tspan><tspan class="cmd">terraform apply -auto-approve</tspan></text><text x="22" y="141" class="m f3"><tspan class="pr"></tspan><tspan class="out">Plan: 12 to add, 0 to change, 0 to destroy.</tspan></text><text x="22" y="164" class="m f4"><tspan class="pr"></tspan><tspan class="ok">Apply complete! (and nobody got paged)</tspan></text><text x="22" y="187" class="m f5"><tspan class="pr">$ </tspan><tspan class="cmd">git commit -m "fix"</tspan></text><text x="22" y="210" class="m f6"><tspan class="pr"></tspan><tspan class="out">[main 4f2c1a9] fix the fix of the previous fix</tspan></text><text x="22" y="233" class="m f7"><tspan class="pr">$ </tspan><tspan class="cmd">./deploy.sh --friday</tspan></text><text x="22" y="256" class="m f8"><tspan class="pr"></tspan><tspan class="warn">WARNING: deploying on a Friday. Are you sure? [y/N] y</tspan></text><text x="22" y="279" class="m f9"><tspan class="pr"></tspan><tspan class="ok">Deployed. It works on my machine and in the cloud.</tspan></text>
<rect x="22" y="290" width="8" height="15" class="cur"/>
</svg>